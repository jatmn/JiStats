name: Lint

on:
  merge_group:
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: C++ format and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull_request checkout is a merge commit. Its first parent is the base.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
      - name: Check first-party C and C++ formatting
        run: bash scripts/check_changed_format.sh "$BASE"
      - name: Lint GitHub Actions workflows
        run: |
          workflows=$(git diff --name-only "$BASE" HEAD -- .github/workflows/)
          if [[ -z "$workflows" ]]; then
            exit 0
          fi
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
