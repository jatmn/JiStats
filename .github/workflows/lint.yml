name: Lint

on:
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: C++ format and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull_request checkout is a merge commit. Its first parent is the base.
          fetch-depth: 2
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          gh api -H 'Accept: application/octet-stream' repos/rhysd/actionlint/releases/assets/384924896 > "$RUNNER_TEMP/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run PR lint checks
        run: bash scripts/check_pr_lint.sh HEAD^1 HEAD
