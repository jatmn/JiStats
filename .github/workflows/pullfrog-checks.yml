name: Pullfrog checks

on:
  pull_request:
    paths:
      - '.github/workflows/pullfrog*.yml'
      - 'scripts/pullfrog*.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pullfrog*.yml'
      - 'scripts/pullfrog*.mjs'

concurrency:
  group: pullfrog-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  authorization:
    name: Pullfrog authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/pullfrog-review-check.test.mjs
