name: CI

on:
  pull_request:
    branches: [main, 'release/**', bench/combined-ci-dr]
  merge_group:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      repeat_offline_notice_tests:
        description: Run eight additional offline notice passes to diagnose restart stalls
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether the change can affect the build or tests
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/check_native_ci_selection.sh
          source scripts/native_ci_input.sh
          build=true
          files="$RUNNER_TEMP/jistats-changed-files"
          # Selection is safe only when the target branch enforces a merge queue.
          branch=$(jq -rn --arg branch "$GITHUB_BASE_REF" '$branch | @uri')
          queued=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$branch" --paginate |
            jq -s 'any(.[][]; .type == "merge_queue")')
          if [[ "$queued" != true ]]; then
            reason="target branch has no merge queue"
          elif git rev-parse --verify --quiet "$GITHUB_SHA^2" >/dev/null &&
            git diff --no-ext-diff --no-renames --name-only -z "$GITHUB_SHA^1" "$GITHUB_SHA" -- > "$files"; then
            build=false
            while IFS= read -r -d '' file; do
              is_native_ci_input "$file" || continue
              build=true
              printf -v reason '%q' "$file"
              break
            done < "$files"
          else
            reason="could not determine the changed files for the tested revision"
          fi
          if [ "$build" = true ]; then
            message="Build and tests required ($reason)."
          else
            message="No build or test inputs changed; skipping the Windows and Linux builds."
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  portable:
    name: Portable tests with bundled SQLite
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_NODIRECT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
          # GCC invokes separate assembler and compiler backends. Include their
          # installed package versions even when the driver binary is unchanged.
          dpkg-query -W -f='${binary:Package}=${Version}\n' 'binutils*' 'cpp*' 'g++*' 'gcc*' > "$RUNNER_TEMP/compiler-packages"
          echo "CCACHE_EXTRAFILES=$RUNNER_TEMP/compiler-packages" >> "$GITHUB_ENV"
      - name: Restore compiler results
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bench-dr-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bench-dr-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run portable tests with bundled SQLite
        run: |
          ccache --zero-stats
          cmake -S . -B build-linux -G Ninja -DJISTATS_BUILD_TESTS=ON
          cmake --build build-linux --parallel "$(nproc)"
          ctest --test-dir build-linux --output-on-failure
      - name: Report compiler cache hits and misses
        run: ccache --show-stats --verbose
      - name: Seed compiler results for pull requests
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'bench/combined-ci-dr' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  linux-cross:
    name: Windows cross-build
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ${{ vars.JISTATS_LINUX_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_NODIRECT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - name: Run Pullfrog authorization tests
        run: node --test scripts/pullfrog-review-check.test.mjs
      - name: Install MinGW-w64 and ImageMagick
        if: vars.JISTATS_LINUX_BUILD_RUNNER == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix imagemagick ninja-build ccache
      - name: Identify compiler packages for the cache
        run: |
          # GCC invokes separate assembler and compiler backends. Include their
          # installed package versions even when the driver binary is unchanged.
          dpkg-query -W -f='${binary:Package}=${Version}\n' 'binutils*' 'cpp*' 'g++*' 'gcc*' 'mingw-w64*' > "$RUNNER_TEMP/compiler-packages"
          echo "CCACHE_EXTRAFILES=$RUNNER_TEMP/compiler-packages" >> "$GITHUB_ENV"
      - name: Restore compiler results
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bench-dr-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bench-dr-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the default build and enable the MiniMax CLI and tests
        shell: bash
        run: |
          ccache --zero-stats
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Debug
          targets=$(ninja -C build-mingw -t targets all)
          if grep -q '^JiStatsMiniMaxCli:' <<< "$targets"; then
            echo "::error::The default Windows build has a MiniMax CLI target"
            exit 1
          fi
          cmake -S . -B build-mingw -DJISTATS_BUILD_TESTS=ON -DJISTATS_BUILD_MINIMAX_CLI=ON
      - name: Build the app, MiniMax CLI, and tests
        run: cmake --build build-mingw --parallel "$(nproc)" --target JiStats JiStatsMiniMaxCli JiStatsTests
      - name: Report compiler cache hits and misses
        run: ccache --show-stats --verbose
      - name: Seed compiler results for pull requests
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'bench/combined-ci-dr' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload the test executable for Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests
          path: build-mingw/bin/JiStatsTests.exe
          if-no-files-found: error
          # A Windows-only retry needs the original binary throughout the 30-day rerun window.
          retention-days: 30
          overwrite: true

  ci-passed:
    name: CI passed
    needs: [changes, portable, linux-cross]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.linux-cross.result == 'success' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.repeat_offline_notice_tests && 15 || 5 }}
    steps:
      - if: needs.linux-cross.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - if: needs.linux-cross.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests
          path: build-mingw/bin
      # Run from the checkout root so the suite can read the test fixtures.
      - name: Run Windows suite and diagnose intermittent restart stalls
        id: windows-tests
        if: needs.linux-cross.result == 'success'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          REPEAT_OFFLINE_NOTICE_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat_offline_notice_tests }}
        shell: pwsh
        run: |
          function Invoke-WindowsTests([string[]] $testArguments, [int] $timeoutMs) {
            $options = @{
              FilePath = (Resolve-Path '.\build-mingw\bin\JiStatsTests.exe').Path
              NoNewWindow = $true
              PassThru = $true
            }
            if ($testArguments) { $options.ArgumentList = $testArguments }
            $process = Start-Process @options
            if (!$process.WaitForExit($timeoutMs)) {
              Write-Host "Collecting Windows test thread stacks for PID $($process.Id)"
              try {
                $initFile = Join-Path $env:RUNNER_TEMP 'jistats-init.gdb'
                $stackFile = Join-Path $env:RUNNER_TEMP 'jistats-stacks.gdb'
                @('set auto-load off', 'set debuginfod enabled off') | Set-Content $initFile -Encoding ascii
                @('set print frame-arguments none', 'thread apply all bt 40', 'detach') | Set-Content $stackFile -Encoding ascii
                $startInfo = [System.Diagnostics.ProcessStartInfo]::new('gdb')
                $startInfo.UseShellExecute = $false
                foreach ($arg in @('--batch', '--nx', '--quiet', '-ix', $initFile, '--se=build-mingw/bin/JiStatsTests.exe', '-p', $process.Id, '-x', $stackFile)) {
                  $startInfo.ArgumentList.Add([string]$arg)
                }
                $debugger = [System.Diagnostics.Process]::Start($startInfo)
                if (!$debugger.WaitForExit(15000)) {
                  Write-Warning 'Stack capture exceeded 15 seconds.'
                  $debugger.Kill($true)
                }
              } catch {
                Write-Warning "Could not finish stack capture: $_"
              } finally {
                if (!$process.HasExited) { $process.Kill() }
              }
              throw "Windows tests exceeded the $timeoutMs ms deadline."
            }
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }
          # Reserve 15 seconds for GDB and 35 seconds for runner setup and cleanup.
          Invoke-WindowsTests @('*', '--list-tests', '--reporter', 'xml::out=catch-inventory.xml') 250000
          Invoke-WindowsTests @('*', '--order', 'rand', '--durations', 'yes', '--reporter', 'console', '--reporter', 'xml::out=catch-results.xml') 250000
          $expected = @(git ls-files -- 'tests/*.cpp')
          if ($LASTEXITCODE -ne 0 -or !$expected) { throw 'Cannot enumerate the Windows test sources.' }
          ./scripts/check_test_inventory.ps1 -Inventory catch-inventory.xml -Results catch-results.xml -Output test-file-times.json -ExpectedFiles $expected
          if ($env:REPEAT_OFFLINE_NOTICE_TESTS -ne 'true') { exit 0 }
          foreach ($attempt in 1..8) {
            Write-Host "Checking offline notice restart timing, pass $attempt"
            Invoke-WindowsTests @('[offline_notice]', '--reporter', 'compact', '--success') 60000
          }
          exit 0

      - name: Save verified per-file test times
        if: steps.windows-tests.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-file-times
          path: test-file-times.json
          if-no-files-found: error
          retention-days: 14


      - name: Check job results
        if: always()
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DETECT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          PORTABLE: ${{ needs.portable.result }}
          LINUX: ${{ needs.linux-cross.result }}
          WINDOWS: ${{ steps.windows-tests.outcome }}
        run: |
          set -eu
          echo "Event=$EVENT detection=$DETECT build=$BUILD Linux=$LINUX Windows=$WINDOWS"
          if [[ $EVENT == pull_request ]]; then
            [[ $DETECT == success ]]
            if [[ $BUILD == false ]]; then
              [[ $PORTABLE == skipped && $LINUX == skipped && $WINDOWS == skipped ]]
              exit
            fi
            [[ $BUILD == true ]]
          fi
          [[ $PORTABLE == success && $LINUX == success && $WINDOWS == success ]]
