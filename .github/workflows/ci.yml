name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  merge_group:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      repeat_offline_notice_tests:
        description: Run eight additional offline notice passes to diagnose restart stalls
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether the change can affect the build or tests
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=true
          files="$RUNNER_TEMP/jistats-changed-files"
          # Selection is safe only when the target branch enforces a merge queue.
          branch=$(jq -rn --arg branch "$GITHUB_BASE_REF" '$branch | @uri')
          queued=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$branch" --paginate |
            jq -s 'any(.[][]; .type == "merge_queue")')
          if [[ "$queued" != true ]]; then
            reason="target branch has no merge queue"
          elif git rev-parse --verify --quiet "$GITHUB_SHA^2" >/dev/null &&
            git diff --no-ext-diff --no-renames --name-only -z "$GITHUB_SHA^1" "$GITHUB_SHA" -- > "$files"; then
            build=false
            while IFS= read -r -d '' file; do
              case "$file" in
                # Keep all files in test payload directories as build inputs.
                docs/fixtures/kimi/synthetic_local_runtime/* | docs/fixtures/openai/chatgpt-export-redacted/*)
                  ;;
                *.md)
                  continue ;;
                docs/fixtures/* | .github/workflows/ci.yml)
                  ;;
                docs/*)
                  continue ;;
                # Keep the existing PR-only exemption for non-build metadata and scripts.
                .github/* | scripts/* | LICENSE | .gitignore | .clang-format | .clang-tidy | assets/logo.png)
                  continue ;;
              esac
              build=true
              printf -v reason '%q' "$file"
              break
            done < "$files"
          else
            reason="could not determine the changed files for the tested revision"
          fi
          if [ "$build" = true ]; then
            message="Build and tests required ($reason)."
          else
            message="No build or test inputs changed; skipping the Windows and Linux builds."
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  linux-cross:
    name: Linux tests and Windows cross-build
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Pullfrog authorization tests
        run: node --test scripts/pullfrog-review-check.test.mjs
      - name: Install MinGW-w64 and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix imagemagick ninja-build
      - name: Run portable tests with bundled SQLite
        run: |
          cmake -S . -B build-linux -G Ninja -DJISTATS_BUILD_TESTS=ON
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure
      - name: Check the default build and enable the MiniMax CLI and tests
        shell: bash
        run: |
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Debug
          targets=$(ninja -C build-mingw -t targets all)
          if grep -q '^JiStatsMiniMaxCli:' <<< "$targets"; then
            echo "::error::The default Windows build has a MiniMax CLI target"
            exit 1
          fi
          cmake -S . -B build-mingw -DJISTATS_BUILD_TESTS=ON -DJISTATS_BUILD_MINIMAX_CLI=ON
      - name: Build the app, MiniMax CLI, and tests
        run: cmake --build build-mingw --parallel --target JiStats JiStatsMiniMaxCli JiStatsTests
      - name: Upload the test executable for Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests
          path: build-mingw/bin/JiStatsTests.exe
          if-no-files-found: error
          # A Windows-only retry needs the original binary throughout the 30-day rerun window.
          retention-days: 30
          overwrite: true

  ci-passed:
    name: CI passed
    needs: [changes, linux-cross]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.linux-cross.result == 'success' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.repeat_offline_notice_tests && 15 || 5 }}
    steps:
      - if: needs.linux-cross.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.linux-cross.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests
          path: build-mingw/bin
      # Run from the checkout root so the suite can read the test fixtures.
      - name: Run Windows suite and diagnose intermittent restart stalls
        id: windows-tests
        if: needs.linux-cross.result == 'success'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          REPEAT_OFFLINE_NOTICE_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat_offline_notice_tests }}
        shell: pwsh
        run: |
          function Invoke-WindowsTests([string[]] $testArguments, [int] $timeoutMs) {
            $options = @{
              FilePath = (Resolve-Path '.\build-mingw\bin\JiStatsTests.exe').Path
              NoNewWindow = $true
              PassThru = $true
            }
            if ($testArguments) { $options.ArgumentList = $testArguments }
            $process = Start-Process @options
            if (!$process.WaitForExit($timeoutMs)) {
              Write-Host "Collecting Windows test thread stacks for PID $($process.Id)"
              try {
                $initFile = Join-Path $env:RUNNER_TEMP 'jistats-init.gdb'
                $stackFile = Join-Path $env:RUNNER_TEMP 'jistats-stacks.gdb'
                @('set auto-load off', 'set debuginfod enabled off') | Set-Content $initFile -Encoding ascii
                @('set print frame-arguments none', 'thread apply all bt 40', 'detach') | Set-Content $stackFile -Encoding ascii
                $startInfo = [System.Diagnostics.ProcessStartInfo]::new('gdb')
                $startInfo.UseShellExecute = $false
                foreach ($arg in @('--batch', '--nx', '--quiet', '-ix', $initFile, '--se=build-mingw/bin/JiStatsTests.exe', '-p', $process.Id, '-x', $stackFile)) {
                  $startInfo.ArgumentList.Add([string]$arg)
                }
                $debugger = [System.Diagnostics.Process]::Start($startInfo)
                if (!$debugger.WaitForExit(15000)) {
                  Write-Warning 'Stack capture exceeded 15 seconds.'
                  $debugger.Kill($true)
                }
              } catch {
                Write-Warning "Could not finish stack capture: $_"
              } finally {
                if (!$process.HasExited) { $process.Kill() }
              }
              throw "Windows tests exceeded the $timeoutMs ms deadline."
            }
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }
          # Reserve 15 seconds for GDB and 35 seconds for runner setup and cleanup.
          Invoke-WindowsTests @() 250000
          if ($env:REPEAT_OFFLINE_NOTICE_TESTS -ne 'true') { exit 0 }
          foreach ($attempt in 1..8) {
            Write-Host "Checking offline notice restart timing, pass $attempt"
            Invoke-WindowsTests @('[offline_notice]', '--reporter', 'compact', '--success') 60000
          }
          exit 0

      - name: Check job results
        if: always()
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DETECT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          LINUX: ${{ needs.linux-cross.result }}
          WINDOWS: ${{ steps.windows-tests.outcome }}
        run: |
          set -eu
          echo "Event=$EVENT detection=$DETECT build=$BUILD Linux=$LINUX Windows=$WINDOWS"
          if [[ $EVENT == pull_request ]]; then
            [[ $DETECT == success ]]
            if [[ $BUILD == false ]]; then
              [[ $LINUX == skipped && $WINDOWS == skipped ]]
              exit
            fi
            [[ $BUILD == true ]]
          fi
          [[ $LINUX == success && $WINDOWS == success ]]
