name: CI

on:
  pull_request:
    branches: [main, 'release/**', bench/combined-ci-dr]
  merge_group:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      repeat_offline_notice_tests:
        description: Run eight additional offline notice passes to diagnose restart stalls
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WINDOWS_SHARD_COUNT: '3'

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether the change can affect the build or tests
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/check_native_ci_selection.sh
          source scripts/native_ci_input.sh
          build=true
          files="$RUNNER_TEMP/jistats-changed-files"
          # Selection is safe only when the target branch enforces a merge queue.
          branch=$(jq -rn --arg branch "$GITHUB_BASE_REF" '$branch | @uri')
          queued=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$branch" --paginate |
            jq -s 'any(.[][]; .type == "merge_queue")')
          if [[ "$queued" != true ]]; then
            reason="target branch has no merge queue"
          elif git rev-parse --verify --quiet "$GITHUB_SHA^2" >/dev/null &&
            git diff --no-ext-diff --no-renames --name-only -z "$GITHUB_SHA^1" "$GITHUB_SHA" -- > "$files"; then
            build=false
            while IFS= read -r -d '' file; do
              is_native_ci_input "$file" || continue
              build=true
              printf -v reason '%q' "$file"
              break
            done < "$files"
          else
            reason="could not determine the changed files for the tested revision"
          fi
          if [ "$build" = true ]; then
            message="Build and tests required ($reason)."
          else
            message="No build or test inputs changed; skipping the Windows and Linux builds."
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  portable:
    name: Portable tests with bundled SQLite
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_NODIRECT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - name: Install ccache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ccache_dir="$RUNNER_TEMP/jistats-ccache"
          mkdir -p "$ccache_dir"
          # ccache 4.12.3 Linux x86-64 release.
          gh api -H 'Accept: application/octet-stream' \
            repos/ccache/ccache/releases/assets/352204150 > "$ccache_dir/ccache.tar.xz"
          echo "a99aa455873c978f6905f07e3176cfdf48bb610990c23ce0e1b718da0f38faa7  $ccache_dir/ccache.tar.xz" |
            sha256sum --check
          tar -xJf "$ccache_dir/ccache.tar.xz" -C "$ccache_dir" --strip-components=1 \
            ccache-4.12.3-linux-x86_64/ccache
          echo "$ccache_dir" >> "$GITHUB_PATH"
          # GCC invokes separate assembler and compiler backends. Include their
          # installed package versions even when the driver binary is unchanged.
          dpkg-query -W -f='${binary:Package}=${Version}\n' 'binutils*' 'cpp*' 'g++*' 'gcc*' > "$RUNNER_TEMP/compiler-packages"
          echo "CCACHE_EXTRAFILES=$RUNNER_TEMP/compiler-packages" >> "$GITHUB_ENV"
      - name: Restore compiler results
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bench-dr-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bench-dr-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run portable tests with bundled SQLite and Pullfrog authorization
        run: |
          set -euo pipefail
          node --test scripts/pullfrog-review-check.test.mjs > "$RUNNER_TEMP/pullfrog-authorization.log" 2>&1 &
          authorization_pid=$!
          portable_status=0
          (
            ccache --zero-stats &&
              cmake -S . -B build-linux -G Ninja -DJISTATS_BUILD_TESTS=ON &&
              cmake --build build-linux --parallel "$(nproc)" &&
              ctest --test-dir build-linux --output-on-failure
          ) || portable_status=$?
          authorization_status=0
          wait "$authorization_pid" || authorization_status=$?
          cat "$RUNNER_TEMP/pullfrog-authorization.log"
          if (( portable_status != 0 )); then exit "$portable_status"; fi
          exit "$authorization_status"
      - name: Report compiler cache hits and misses
        run: ccache --show-stats --verbose
      - name: Seed compiler results for pull requests
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'bench/combined-ci-dr' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  linux-cross:
    name: Windows cross-build
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ${{ vars.JISTATS_LINUX_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_NODIRECT: 'true'
    steps:
      - name: Install MinGW-w64 and ImageMagick in parallel with checkout and cache restore
        id: toolchain
        if: vars.JISTATS_LINUX_BUILD_RUNNER == ''
        run: |
          set -euo pipefail
          setup_dir=$(mktemp -d "$RUNNER_TEMP/jistats-toolchain.XXXXXXXX")
          exec {setup_lock}>"$setup_dir/install.lock"
          flock -x "$setup_lock"
          (
            trap 'printf "%s\n" "$?" > "$setup_dir/install.status"' EXIT
            packages=(g++-mingw-w64-x86-64-posix imagemagick ccache)
            if ! command -v ninja >/dev/null; then
              packages+=(ninja-build)
            fi
            # The hosted VM is discarded after this job. Its toolchain needs
            # neither crash-recovery flushes nor a daemon restart scan.
            install=(sudo env NEEDRESTART_SUSPEND=1 apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends)
            if ! "${install[@]}" "${packages[@]}"; then
              sudo apt-get update
              "${install[@]}" "${packages[@]}"
            fi
          ) </dev/null > "$setup_dir/install.log" 2>&1 &
          # The installer inherits the lock and releases it after writing its status.
          exec {setup_lock}>&-
          echo "directory=$setup_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - name: Restore compiler results
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bench-dr-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bench-dr-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the pinned CMake dependencies and wait for MinGW
        if: ${{ !cancelled() && steps.toolchain.outputs.directory != '' }}
        env:
          SETUP_DIR: ${{ steps.toolchain.outputs.directory }}
        run: |
          set -euo pipefail
          deps_dir="$PWD/build-mingw/_deps"
          cmake -S cmake/prefetch -B "$RUNNER_TEMP/jistats-prefetch" \
            -DFETCHCONTENT_BASE_DIR="$deps_dir" &
          prefetch_pid=$!
          flock -x "$SETUP_DIR/install.lock" true
          cat "$SETUP_DIR/install.log"
          prefetch_status=0
          wait "$prefetch_pid" || prefetch_status=$?
          read -r install_status < "$SETUP_DIR/install.status"
          if (( install_status != 0 )); then exit "$install_status"; fi
          if (( prefetch_status != 0 )); then exit "$prefetch_status"; fi
          echo "JISTATS_PREFETCHED_DEPS_DIR=$deps_dir" >> "$GITHUB_ENV"
      - name: Identify compiler packages for the cache
        run: |
          # GCC invokes separate assembler and compiler backends. Include their
          # installed package versions even when the driver binary is unchanged.
          dpkg-query -W -f='${binary:Package}=${Version}\n' 'binutils*' 'cpp*' 'g++*' 'gcc*' 'mingw-w64*' > "$RUNNER_TEMP/compiler-packages"
          echo "CCACHE_EXTRAFILES=$RUNNER_TEMP/compiler-packages" >> "$GITHUB_ENV"
      - name: Check the default build and enable the MiniMax CLI and tests
        shell: bash
        run: |
          ccache --zero-stats
          sources=()
          if [[ -n ${JISTATS_PREFETCHED_DEPS_DIR:-} ]]; then
            sources=(
              "-DFETCHCONTENT_SOURCE_DIR_SQLITE=$JISTATS_PREFETCHED_DEPS_DIR/sqlite-src"
              "-DFETCHCONTENT_SOURCE_DIR_SPDLOG=$JISTATS_PREFETCHED_DEPS_DIR/spdlog-src"
              "-DFETCHCONTENT_SOURCE_DIR_CATCH2=$JISTATS_PREFETCHED_DEPS_DIR/catch2-src"
            )
          fi
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Debug "${sources[@]}"
          targets=$(ninja -C build-mingw -t targets all)
          if grep -q '^JiStatsMiniMaxCli:' <<< "$targets"; then
            echo "::error::The default Windows build has a MiniMax CLI target"
            exit 1
          fi
          cmake -S . -B build-mingw -DJISTATS_BUILD_TESTS=ON -DJISTATS_BUILD_MINIMAX_CLI=ON
      - name: Build the app, MiniMax CLI, and tests
        run: cmake --build build-mingw --parallel "$(nproc)" --target JiStats JiStatsMiniMaxCli JiStatsTests
      - name: Report compiler cache hits and misses
        run: ccache --show-stats --verbose
      - name: Seed compiler results for pull requests
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'bench/combined-ci-dr' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Prepare Windows test inputs
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          git archive --format=tar "$GITHUB_SHA" > build-mingw/windows-test-inputs.tar
          printf '%s\n' "$GITHUB_SHA" > build-mingw/windows-test-revision.txt
      - name: Upload Windows test inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests
          path: |
            build-mingw/bin/JiStatsTests.exe
            build-mingw/windows-test-inputs.tar
            build-mingw/windows-test-revision.txt
          compression-level: 1
          if-no-files-found: error
          # A Windows-only retry needs the same inputs throughout the 30-day rerun window.
          retention-days: 30
          overwrite: true

  windows-tests:
    name: Windows tests (shard ${{ matrix.shard }})
    needs: linux-cross
    if: ${{ !cancelled() && needs.linux-cross.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.repeat_offline_notice_tests && 15 || 5 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests
          path: build-mingw
      - name: Install tested Windows inputs
        shell: pwsh
        run: |
          $revision = (Get-Content -Raw -LiteralPath build-mingw/windows-test-revision.txt).Trim()
          if ($revision -cne $env:GITHUB_SHA) { throw "Unexpected Windows test revision: $revision" }
          tar.exe -xf build-mingw/windows-test-inputs.tar
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract Windows test inputs.' }
      # Run from the source root so the suite can read the test fixtures.
      - name: Run Windows suite and diagnose intermittent restart stalls
        env:
          SHARD: ${{ matrix.shard }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          REPEAT_OFFLINE_NOTICE_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat_offline_notice_tests }}
        shell: pwsh
        run: |
          function Invoke-WindowsTests([string[]] $testArguments, [int] $timeoutMs) {
            $options = @{
              FilePath = (Resolve-Path '.\build-mingw\bin\JiStatsTests.exe').Path
              NoNewWindow = $true
              PassThru = $true
            }
            if ($testArguments) { $options.ArgumentList = $testArguments }
            $process = Start-Process @options
            if (!$process.WaitForExit($timeoutMs)) {
              Write-Host "Collecting Windows test thread stacks for PID $($process.Id)"
              try {
                $initFile = Join-Path $env:RUNNER_TEMP 'jistats-init.gdb'
                $stackFile = Join-Path $env:RUNNER_TEMP 'jistats-stacks.gdb'
                @('set auto-load off', 'set debuginfod enabled off') | Set-Content $initFile -Encoding ascii
                @('set print frame-arguments none', 'thread apply all bt 40', 'detach') | Set-Content $stackFile -Encoding ascii
                $startInfo = [System.Diagnostics.ProcessStartInfo]::new('gdb')
                $startInfo.UseShellExecute = $false
                foreach ($arg in @('--batch', '--nx', '--quiet', '-ix', $initFile, '--se=build-mingw/bin/JiStatsTests.exe', '-p', $process.Id, '-x', $stackFile)) {
                  $startInfo.ArgumentList.Add([string]$arg)
                }
                $debugger = [System.Diagnostics.Process]::Start($startInfo)
                if (!$debugger.WaitForExit(15000)) {
                  Write-Warning 'Stack capture exceeded 15 seconds.'
                  $debugger.Kill($true)
                }
              } catch {
                Write-Warning "Could not finish stack capture: $_"
              } finally {
                if (!$process.HasExited) { $process.Kill() }
              }
              throw "Windows tests exceeded the $timeoutMs ms deadline."
            }
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }
          # Reserve 15 seconds for GDB and 35 seconds for runner setup and cleanup.
          # All shards use the same seed, including on a full retry.
          $seed = [uint32](([uint64]$env:GITHUB_RUN_ID % 4294967295) + 1)
          if ($env:SHARD -eq '0') {
            Invoke-WindowsTests @('*', '--list-tests', '--reporter', 'xml::out=catch-inventory.xml') 250000
          }
          Invoke-WindowsTests @(
            '*', '--order', 'rand', '--rng-seed', "$seed",
            '--shard-count', "$env:WINDOWS_SHARD_COUNT", '--shard-index', "$env:SHARD",
            '--durations', 'yes', '--reporter', 'console', '--reporter', 'xml::out=catch-results.xml'
          ) 250000
          if ($env:SHARD -ne '0' -or $env:REPEAT_OFFLINE_NOTICE_TESTS -ne 'true') { exit 0 }
          foreach ($attempt in 1..8) {
            Write-Host "Checking offline notice restart timing, pass $attempt"
            Invoke-WindowsTests @('[offline_notice]', '--reporter', 'compact', '--success') 60000
          }
          exit 0

      - name: Save Windows shard reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-report-${{ matrix.shard }}
          path: |
            catch-results.xml
            catch-inventory.xml
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  ci-passed:
    name: CI passed
    permissions:
      actions: read
      contents: read
    needs: [changes, portable, linux-cross, windows-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - name: Check job results
        if: always()
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DETECT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          PORTABLE: ${{ needs.portable.result }}
          LINUX: ${{ needs.linux-cross.result }}
          WINDOWS: ${{ needs.windows-tests.result }}
        run: |
          set -eu
          echo "Event=$EVENT detection=$DETECT build=$BUILD Linux=$LINUX Windows=$WINDOWS"
          if [[ $EVENT == pull_request ]]; then
            [[ $DETECT == success ]]
            if [[ $BUILD == false ]]; then
              [[ $PORTABLE == skipped && $LINUX == skipped && $WINDOWS == skipped ]]
              exit
            fi
            [[ $BUILD == true ]]
          fi
          [[ $PORTABLE == success && $LINUX == success && $WINDOWS == success ]]
      - if: needs.windows-tests.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-test-report-*
          path: windows-reports
      - name: Verify the full Windows test inventory
        if: needs.windows-tests.result == 'success'
        shell: pwsh
        run: |
          $expected = @(git ls-files -- 'tests/*.cpp')
          if ($LASTEXITCODE -ne 0 -or !$expected) { throw 'Cannot enumerate the Windows test sources.' }
          $results = @(0..([int]$env:WINDOWS_SHARD_COUNT - 1) | ForEach-Object {
            "windows-reports/windows-test-report-$_/catch-results.xml"
          })
          ./scripts/check_test_inventory.ps1 -Inventory windows-reports/windows-test-report-0/catch-inventory.xml -Results $results -Output test-file-times.json -ExpectedFiles $expected
      - name: Save verified per-file test times
        if: needs.windows-tests.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-file-times
          path: test-file-times.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Check the test-file time budget
        if: needs.windows-tests.result == 'success'
        shell: pwsh
        run: |
          $timings = Get-Content -Raw -LiteralPath test-file-times.json | ConvertFrom-Json
          $slow = @($timings.files | Where-Object { $_.seconds -gt 20 })
          foreach ($row in $slow) { Write-Host "$($row.file) took $($row.seconds) seconds" }
          if ($slow.Count) { throw "$($slow.Count) test files exceeded 20 seconds." }
      - name: Verify CI budget retry cases
        if: ${{ !cancelled() }}
        shell: bash
        run: python -B scripts/test_check_ci_budgets.py
      - name: Measure native CI budgets after all tests finish
        id: budget-timing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_JOB: ${{ job.check_run_id }}
          DETECT: ${{ needs.changes.result }}
          PORTABLE: ${{ needs.portable.result }}
          LINUX: ${{ needs.linux-cross.result }}
          WINDOWS: ${{ needs.windows-tests.result }}
        run: |
          set -euo pipefail
          windows_args=()
          if [[ "$WINDOWS" == success ]]; then
            windows_args+=(--windows-result "$WINDOWS")
            for (( shard=0; shard<WINDOWS_SHARD_COUNT; shard++ )); do
              windows_args+=(--windows-shard "Windows tests (shard $shard)")
            done
          fi
          # Partial reruns can reuse upstream jobs that ran in earlier attempts.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" |
            jq -s . | python scripts/check_ci_budgets.py \
              --running-job "$CURRENT_JOB" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT" \
              --upstream "Detect build changes" "$DETECT" \
              --upstream "Portable tests with bundled SQLite" "$PORTABLE" \
              --upstream "Windows cross-build" "$LINUX" "${windows_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Keep this step separate so retries can distinguish measured overruns from
      # checkout, test and measurement failures.
      - name: Fail on a measured native CI overrun
        if: ${{ steps.budget-timing.outputs.overrun == 'true' }}
        shell: bash
        run: |
          echo "::error::Native CI exceeded its time budget on this or an earlier attempt."
          exit 1
