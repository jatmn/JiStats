name: CI timing budgets

on:
  workflow_run:
    workflows: [CI, Lint, CodeQL analysis, Pullfrog checks, Pullfrog]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed workflow run ID in this repository
        required: true
        type: string
      attempt:
        description: Workflow run attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  budgets:
    name: Check completed job timings
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # workflow_run uses the trusted default-branch revision. Never check out
      # the triggering PR, download its artifacts or execute its commands.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
      - name: Evaluate every job on the specified attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[1-9][0-9]*$ && $ATTEMPT =~ ^[1-9][0-9]*$ ]]
          echo "Measuring $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
          run_api="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          workflow=$(gh api "$run_api" --jq .path)
          report_only=false
          case "${workflow%%@*}" in
            .github/workflows/ci.yml | .github/workflows/lint.yml | .github/workflows/pullfrog-checks.yml) ;;
            *) report_only=true ;;
          esac
          gh api --paginate "$run_api/attempts/$ATTEMPT/jobs?per_page=100" |
            jq --slurp --raw-output --argjson report_only "$report_only" -f scripts/check_ci_budgets.jq |
            tee -a "$GITHUB_STEP_SUMMARY"
